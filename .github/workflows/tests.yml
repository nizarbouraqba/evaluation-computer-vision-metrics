name: Vérification des métriques et de la classification
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Installer PyTorch CPU et les dépendances
        run: |
          python -m pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
      - name: Tester les cas limites
        run: python -m pytest -q
      - name: Exécuter la classification réelle
        run: python -m examples.classification_metrics
      - name: Vérifier le format du notebook
        run: python -c "import nbformat; nbformat.validate(nbformat.read('notebooks/TP_Evaluation_Computer_Vision.ipynb', as_version=4))"
      # Les modèles et images Penn-Fudan ne sont pas téléchargés dans ce test rapide.
